# ============================================================
# CONFIG.YAML - Trenes España
# Rutas de tren desde Madrid, buscando en Ouigo (y Renfe cuando esté disponible).
# Salida viernes a partir de las 15:00, vuelta domingo a partir de las 17:00.
# ============================================================

semanas_adelante: 14       # cuántas semanas hacia adelante buscar
hora_minima_ida: "15:00"   # hora mínima salida viernes
hora_minima_vuelta: "17:00" # hora mínima salida domingo

rutas:
  # --- Rutas cubiertas por Ouigo ---

  - nombre: "Madrid - Sevilla"
    origen: "Madrid"
    destino: "Sevilla"
    umbral_precio: 50        # EUR por persona ida+vuelta

  - nombre: "Madrid - Málaga"
    origen: "Madrid"
    destino: "Málaga"
    umbral_precio: 60

  - nombre: "Madrid - Alicante"
    origen: "Madrid"
    destino: "Alicante"
    umbral_precio: 50

  - nombre: "Madrid - Córdoba"
    origen: "Madrid"
    destino: "Córdoba"
    umbral_precio: 40

  - nombre: "Madrid - Barcelona"
    origen: "Madrid"
    destino: "Barcelona"
    umbral_precio: 60

  - nombre: "Madrid - Tarragona"
    origen: "Madrid"
    destino: "Tarragona"
    umbral_precio: 55

  - nombre: "Madrid - Valencia"
    origen: "Madrid"
    destino: "Valencia"
    umbral_precio: 45

  - nombre: "Madrid - Zaragoza"
    origen: "Madrid"
    destino: "Zaragoza"
    umbral_precio: 35

  - nombre: "Madrid - Murcia"
    origen: "Madrid"
    destino: "Murcia"
    umbral_precio: 50
